name: build
on:
  push:
    branches: [main, 'm*/**', 'wt/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Guard (no web view, no network)
        shell: pwsh
        run: ./build/guard.ps1
      - name: Restore
        run: dotnet restore InterviewRecorder.sln
      - name: Build
        run: dotnet build InterviewRecorder.sln -c Release --no-restore
      - name: Unit tests
        run: dotnet test InterviewRecorder.sln -c Release --no-build --filter "Category!=E2E&Category!=Hardware" --logger "trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 7
