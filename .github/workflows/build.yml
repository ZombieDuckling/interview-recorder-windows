name: build
on:
  push:
    branches: [main, 'wt/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  test:
    # Branch pushes that have an open PR are tested once, by the pull_request event.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Guard (no web view, no network)
        shell: pwsh
        run: ./build/guard.ps1
      - name: Restore
        run: dotnet restore InterviewRecorder.sln
      - name: Build
        run: dotnet build InterviewRecorder.sln -c Release --no-restore
      - name: Unit tests
        run: dotnet test InterviewRecorder.sln -c Release --no-build --filter "Category!=E2E&Category!=Hardware&Category!=Model" --logger "trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 7

  installer:
    # Only for main, tags and manual runs (Actions minutes are paid).
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.ref }}' -like 'refs/tags/v*') { '${{ github.ref_name }}'.TrimStart('v') -replace '-.*$','' } else { '1.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Publish app (self-contained win-x64)
        run: dotnet publish src/Recorder.App/Recorder.App.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.ver.outputs.version }} -o publish/app
      - name: Bundle FFmpeg (LGPL) and model
        shell: pwsh
        run: |
          ./build/fetch-ffmpeg.ps1 -Destination third_party/ffmpeg
          Copy-Item third_party/ffmpeg/bin/ffmpeg.exe publish/app/ffmpeg.exe
          if (Test-Path third_party/ffmpeg/FFMPEG-LICENSE.txt) { Copy-Item third_party/ffmpeg/FFMPEG-LICENSE.txt publish/app/ }
          ./build/fetch-model.ps1 -Destination publish/app/models
          Copy-Item models/manifest.json publish/app/models/manifest.json
          Copy-Item THIRD-PARTY-NOTICES.md publish/app/
          # The app looks for these exact paths (Composition/AppComposition.cs)
          foreach ($f in 'publish/app/ffmpeg.exe','publish/app/models/ggml-base-q5_1.bin','publish/app/models/manifest.json') { if (-not (Test-Path $f)) { throw "missing $f" } }
      - name: Runtime guard (no web view DLLs shipped)
        shell: pwsh
        run: |
          $bad = Get-ChildItem publish/app -Recurse -Include *WebView2*,EmbeddedBrowserWebView* -ErrorAction SilentlyContinue
          if ($bad) { $bad | ForEach-Object FullName; throw 'web view binaries found in publish output' }
      - name: Build MSI (per-user, WiX 5)
        run: dotnet build packaging/windows/Package/InterviewRecorder.Package.wixproj -c Release -p:ProductVersion=${{ steps.ver.outputs.version }} -p:PublishDir=${{ github.workspace }}\publish\app -o out/msi
      - name: Build Burn bundle (.exe)
        run: dotnet build packaging/windows/Bundle/InterviewRecorder.Bundle.wixproj -c Release -p:ProductVersion=${{ steps.ver.outputs.version }} -p:MsiPath=${{ github.workspace }}\out\msi\InterviewRecorder-x64.msi -o out/bundle
      - name: Sign (only when a certificate is configured)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: ./build/sign.ps1 -Files out/bundle/InterviewRecorder-Setup-x64.exe
      - name: Hashes
        shell: pwsh
        run: |
          Get-ChildItem out/bundle/*.exe, out/msi/*.msi | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Tee-Object out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            out/bundle/InterviewRecorder-Setup-x64.exe
            out/msi/InterviewRecorder-x64.msi
            out/SHA256SUMS.txt
          retention-days: 14
      - name: Install (per-user, silent) — SDLC-17
        shell: pwsh
        run: |
          $p = Start-Process out/bundle/InterviewRecorder-Setup-x64.exe -ArgumentList '/quiet','/norestart','/log','out/install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content out/install.log -Tail 40; throw "install exit $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Interview Recorder\InterviewRecorder.exe'
          if (-not (Test-Path $exe)) { throw "not installed at $exe (per-user location)" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'Interview Recorder*.lnk'
          if (-not $lnk) { throw 'Start Menu shortcut missing' }
          "IR_APP_EXE=$exe" >> $env:GITHUB_ENV
          "installed: $exe; shortcut: $($lnk.FullName)"
      - name: E2E smoke on the installed app (FlaUI)
        env:
          IR_SCREENSHOTS: ${{ github.workspace }}\out\screens
        run: dotnet test tests/Recorder.E2E/Recorder.E2E.csproj -c Release --filter "Category=E2E" --logger "trx" --results-directory out/e2e
      - name: Real speech through the installed ffmpeg + model (Windows runtimes)
        shell: pwsh
        run: |
          $app = Split-Path $env:IR_APP_EXE
          $s = 'out\IR-20261030-120000-ABCD'; New-Item -ItemType Directory -Force "$s\capture\mic","$s\capture\meeting" | Out-Null
          Add-Type -AssemblyName System.Speech
          $tts = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $tts.SetOutputToWaveFile("$PWD\out\mic.wav");     $tts.Speak('Thank you for joining this research interview. Can you tell me about your work at the clinic?'); $tts.SetOutputToNull()
          $tts.SetOutputToWaveFile("$PWD\out\meeting.wav"); $tts.Speak('I am a nurse in a primary care clinic in Durban, and most days start with a long morning queue.'); $tts.SetOutputToNull()
          & "$app\ffmpeg.exe" -v error -i out\mic.wav -af "apad=pad_dur=8" -ar 48000 -ac 1 -c:a pcm_s16le -f segment -segment_time 10 -segment_start_number 1 "$s\capture\mic\%06d.wav"
          & "$app\ffmpeg.exe" -v error -i out\meeting.wav -af "adelay=8000,apad=pad_dur=1" -ar 48000 -ac 1 -c:a pcm_s16le -f segment -segment_time 10 -segment_start_number 1 "$s\capture\meeting\%06d.wav"
          dotnet run --project tools/PipelineProbe -c Release -- $s "$app\models\ggml-base-q5_1.bin" "$app\ffmpeg.exe" 2
          if (-not (Test-Path "$s\interview_audio.mp4") -or -not (Test-Path "$s\interview_transcript.docx")) { throw 'pipeline outputs missing' }
          & "$app\ffmpeg.exe" -hide_banner -i "$s\interview_audio.mp4" 2>&1 | Select-String 'Audio:|Video:'
      - name: Uninstall and check clean removal — SDLC-17
        if: always() && env.IR_APP_EXE != ''
        shell: pwsh
        run: |
          $p = Start-Process out/bundle/InterviewRecorder-Setup-x64.exe -ArgumentList '/uninstall','/quiet','/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exit $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Interview Recorder'
          if (Test-Path $dir) { Get-ChildItem $dir -Recurse | Select-Object -First 20 FullName; throw 'program files left behind' }
          if (Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'Interview Recorder*.lnk') { throw 'shortcut left behind' }
          'uninstall clean'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: |
            out/screens/*.png
            out/screens/*.txt
            out/e2e/*.trx
            out/install.log
            out/IR-20261030-120000-ABCD/transcript.json
            out/IR-20261030-120000-ABCD/interview_transcript.docx
            out/IR-20261030-120000-ABCD/interview_audio.mp4
          retention-days: 14

  release:
    # Tag v* (for example v1.0.0): publish the installer built above to a GitHub release in this private repo.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      - name: Create release with installer and hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f | sort
          gh release create "${{ github.ref_name }}" dist/bundle/*.exe dist/msi/*.msi dist/SHA256SUMS.txt \
            -R "${{ github.repository }}" --title "Interview Recorder ${{ github.ref_name }} (Windows)" \
            --notes "Per-user installer (no administrator rights). Unsigned until a code-signing certificate exists: Windows SmartScreen will warn (More info > Run anyway). Verify the SHA-256 against SHA256SUMS.txt. See docs/known-limitations.md."
